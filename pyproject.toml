[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-gate-framework"
version = "2.0.0"
description = "Reference validators and runtime contracts for TRACE Gate Framework"
license = "CC-BY-4.0 AND CC-BY-NC-ND-4.0 AND LicenseRef-401SPAG-NC-ND-1.0"
license-files = ["LICENSE", "LICENSE-CODE", "LICENSING.md", "CONTRIBUTING.md", "licenses/CC-BY-4.0.txt", "docs/LICENSING-TRANSITION.ko.md", "docs/licensing/transition-2026-11-14.json"]
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
trace-gate-validate = "trace_gate.validation:main"
trace-gate-evaluate = "trace_gate.gates:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
