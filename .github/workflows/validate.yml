name: TRACE conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate contracts
        run: python scripts/validate_templates.py
      - name: Run negative and runtime tests
        run: python -m pytest -q
      - name: Build and check installed wheel and source distribution
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP"
          for artifact in dist/*.whl dist/*.tar.gz; do
            env_dir="$RUNNER_TEMP/env-$(basename "$artifact")"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install --no-cache-dir "$artifact"
            "$env_dir/bin/python" -m pip check
            PATH="$env_dir/bin:$PATH" "$env_dir/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed_contracts.py"
          done
